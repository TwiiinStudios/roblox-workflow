# Claude on GitHub: write "@claude <what you want>" in an issue, an issue comment,
# a PR comment or a PR review, and Claude does the work on a branch and replies there.
#
# Examples:
#   New issue: "@claude add a shop where players buy flies for 10 coins each"
#   PR comment: "@claude the shop button overlaps the coin counter on mobile, fix it"
#
# Setup (once per repo): run /install-github-app in Claude Code, or add the secret
# CLAUDE_CODE_OAUTH_TOKEN yourself (create it with `claude setup-token`).
# Only people with write access to the repo can trigger it.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install toolchain (rokit.toml)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Install packages (wally.toml)
        run: wally install

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(lune run:*),Bash(rojo build:*),Bash(rojo sourcemap:*),Bash(stylua:*),Bash(selene:*),Bash(wally install),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"
