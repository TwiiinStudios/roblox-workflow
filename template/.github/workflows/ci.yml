# Runs on every pull request and every push to main.
# Same checks as `lune run tools/check.luau` on your PC, plus it uploads the built place
# so anyone can download it from the run page and open it in Studio.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HAS_ROBLOX_KEY: ${{ secrets.ROBLOX_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain (rokit.toml)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Install packages (wally.toml)
        run: wally install

      - name: Format check
        run: stylua --check src tests tools

      - name: Lint
        run: selene src

      - name: World files
        run: lune run tools/lint-world.luau

      - name: Names (family-friendly, tools/names)
        run: lune run tools/names.luau

      - name: Models
        run: lune run tools/lint-models.luau

      - name: No scripts in models (other people's code stays out)
        run: lune run tools/model-scripts.luau

      - name: Unit tests
        run: lune run tools/test.luau

      - name: Build place
        run: lune run tools/build.luau

      - name: Performance budget (meshes, images, parts… what a new player downloads)
        run: lune run tools/budget.luau

      - name: Cloud test (the server on a Roblox cloud server)
        if: github.event_name == 'pull_request' && env.HAS_ROBLOX_KEY == 'true'
        run: lune run tools/cloudtest.luau --no-build
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}

      - name: Upload built place
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ github.sha }}
          path: build/game.rbxl
          retention-days: 14
